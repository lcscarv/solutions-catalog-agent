[project]
name = "solutions-catalog-agent"
version = "0.1.0"
description = "Agente Bedrock de catálogo de soluções: laboratório local e free tier."
requires-python = ">=3.12"
# boto3 já vem no runtime da Lambda: as Lambdas não empacotam dependência.
# Aqui ele serve aos scripts locais, aos testes e à avaliação.
dependencies = ["boto3>=1.40"]

[dependency-groups]
dev = ["pytest>=8.3", "pyyaml>=6.0", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog_action", "src/kb_ingest", "src/docs_search", "src/agent_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Não depende da instalação editável: no macOS, com ~/Documents no iCloud, o
# .pth do .venv recebe a flag "hidden" e o Python passa a ignorá-lo.
pythonpath = ["src"]
markers = ["integration: precisa do DynamoDB Local rodando (make up)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
